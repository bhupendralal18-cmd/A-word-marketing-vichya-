<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <div class="card">
        <p class="eyebrow">Fun time</p>
        <h1>Random Joke Generator</h1>

        <div class="badge" id="jokeCategory">Category: General</div>

        <div class="joke-box">
          <p id="jokeText">Loading a joke...</p>
        </div>

        <button id="newJokeBtn" class="primary-btn" type="button">
          Tell me another one
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
